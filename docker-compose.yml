services:
  forca-mysql:
    image: mysql:8.0
    container_name: forca-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forca_db
      MYSQL_USER: forca_user
      MYSQL_PASSWORD: forca_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - forca-network

  forca-mongodb:
    image: mongo:6.0
    container_name: forca-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - forca-network

  forca-neo4j:
    image: neo4j:5.26.0-community
    container_name: forca-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/forcasecret
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - forca-network

  forca-app:
    build: .
    container_name: forca-app
    stdin_open: true
    tty: true
    depends_on:
      forca-mysql:
        condition: service_healthy
      forca-mongodb:
        condition: service_healthy
    environment:
      - MYSQL_HOST=forca-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=forca_user
      - MYSQL_PASSWORD=forca_password
      - MYSQL_DATABASE=forca_db
      - MONGO_URI=mongodb://forca-mongodb:27017/
      - MONGO_DATABASE=forca_db
      - DICIONARIO_MAX_POR_CATEGORIA=500
      - WORD_BACKEND=mongo
      - NEO4J_URI=bolt://forca-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=forcasecret
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM:-truecolor}
    volumes:
      - .:/app
      - ./data:/app/data
    networks:
      - forca-network

volumes:
  mysql_data:
  mongo_data:
  neo4j_data:

networks:
  forca-network:
    driver: bridge
